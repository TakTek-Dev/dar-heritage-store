<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml">

<meta property="og:type" content="website">
<meta property="og:site_name" content="DAR">

<meta property="og:description" content="Shop Palestinian dresses, bags, keffiyehs, embroidery and accessories from the DAR 2026 catalogue.">

<meta property="og:image:height" content="630">

<meta property="og:locale" content="en_GB">
<meta name="twitter:card" content="summary_large_image">
<link rel="alternate" hreflang="ar" href="https://taktek-dev.github.io/dar-heritage-store/shop.html">
<link rel="alternate" hreflang="en" href="https://taktek-dev.github.io/dar-heritage-store/en/shop.html">
<link rel="alternate" hreflang="tr" href="https://taktek-dev.github.io/dar-heritage-store/tr/shop.html">
<meta name="description" content="Shop Palestinian dresses, bags, keffiyehs, embroidery and accessories from the DAR 2026 catalogue.">
<link rel="preload" href="../assets/fonts/thmanyah-serif-display-700.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="../assets/fonts/thmanyah-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/tokens.css?v=6">
<link rel="stylesheet" href="../assets/css/base.css?v=13">
<link rel="stylesheet" href="../assets/css/site.css?v=21">
<link rel="stylesheet" href="../assets/css/shop.css?v=8">
</head>
<body data-page="shop">

<div data-site="header"></div>

<main id="main">
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb"><a href="index.html">Home</a><span aria-hidden="true">/</span><span aria-current="page">Shop</span></nav>
    <p class="demo-note"><span data-motif="starlet"></span>Design preview: prices will be added before launch.</p>

    <div class="shop-head">
      <div>
        <span class="eyebrow up"><span data-motif="starlet"></span>DAR catalogue 2026</span>
        <h1 class="rise" id="shop-title">All pieces</h1>
        <p class="up" id="shop-sub"></p>
      </div>
      <span class="shop-head__star" data-motif="star" data-mode="cross" data-order="radial" data-stitch aria-hidden="true"></span>
    </div>

    <div class="loom up" id="loom" role="group" aria-label="Collections"></div>

    <div class="shop">
      <aside class="filters" id="filters" aria-labelledby="filters-h">
        <h2 id="filters-h">Filter</h2>
        <button class="icon-btn filters__close" type="button" aria-label="Close filters" data-close-filters><span data-motif="i-close"></span></button>
        <fieldset id="f-craft"><legend>Craft</legend></fieldset>
        <fieldset><legend>Colour</legend><div class="swatches-f" id="f-color"></div></fieldset>
        <button class="btn btn--quiet filters__reset" type="button" id="reset">Clear filters</button>
        <button class="btn filter-apply" type="button" data-close-filters>Show results</button>
      </aside>

      <section aria-labelledby="shop-title">
        <div class="toolbar">
          <div class="field"><label for="q">Search the pieces</label><input id="q" type="search" placeholder="Jacket, keffiyeh, bracelet" autocomplete="off"></div>
          <div class="toolbar__end">
            <div class="field" style="min-width:0;flex:none"><label for="sort">Sort by</label>
              <select id="sort"><option value="">Featured</option><option value="name">Name</option><option value="code">Code</option></select>
            </div>
            <button class="btn btn--quiet filter-btn" type="button" id="filter-btn" aria-controls="filters" aria-expanded="false">Filter <span class="num" id="filter-n"></span></button>
          </div>
        </div>
        <p class="toolbar__count" id="count" role="status" aria-live="polite"></p>
        <h2 class="sr-only">Pieces</h2>
        <div class="products" id="grid" style="margin-block-start:var(--s3)"></div>
        <div class="empty" id="empty" hidden>
          <span data-motif="starlet" data-mode="cross"></span>
          <b>No pieces match this search</b>
          <p>Try another word or clear the filters.</p>
          <button class="btn" type="button" data-reset>Clear filters</button>
        </div>
      </section>
    </div>
  </div>
</main>

<div class="sheet-backdrop" id="backdrop" data-close-filters></div>
<div data-site="footer"></div>

<script src="../assets/js/i18n.js?v=1"></script>
<script src="../assets/js/stitch.js?v=9"></script>
<script src="../assets/js/products.js?v=5"></script>
<script src="../assets/js/site.js?v=17"></script>
<script src="../assets/js/shop-page.js?v=7"></script>
</body>
</html>
