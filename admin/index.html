<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم دار</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preload" href="../assets/fonts/thmanyah-sans-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="../assets/css/tokens.css?v=5">
<link rel="stylesheet" href="../assets/css/base.css?v=11">
<link rel="stylesheet" href="admin.css?v=5">
</head>
<body class="admin">

<div class="app">
  <aside class="side" id="side" aria-label="قائمة لوحة التحكم">
    <a class="side__brand" href="#overview"><img src="../assets/brand/dar-logo-mark.svg" alt="" width="40" height="53"><span><b>لوحة دار</b><small>المتجر والمحتوى</small></span></a>
    <nav>
      <a href="#overview" data-nav="overview"><span data-motif="i-home"></span>الرئيسية</a>
      <a href="#orders" data-nav="orders"><span data-motif="i-box"></span>الطلبات<span class="badge num" id="nav-new"></span></a>
      <a href="#products" data-nav="products"><span data-motif="i-tag"></span>المنتجات<span class="badge num" id="nav-noprice"></span></a>
      <a href="#content" data-nav="content"><span data-motif="i-text"></span>محتوى الموقع</a>
      <a href="#settings" data-nav="settings"><span data-motif="i-sliders"></span>الإعدادات</a>
    </nav>
    <div class="side__foot">
      <a href="../index.html" target="_blank" rel="noopener"><span data-motif="i-eye"></span>عرض المتجر</a>
      <div class="who"><i>د</i><span><b>مدير دار</b><small>معاينة بلا تسجيل دخول حقيقي</small></span></div>
    </div>
  </aside>

  <div>
    <header class="top">
      <button class="icon-btn menu" type="button" aria-label="فتح القائمة" aria-controls="side" aria-expanded="false"><span data-motif="i-menu"></span></button>
      <div><span class="crumb" id="crumb">لوحة دار</span><h1 id="title" tabindex="-1">الرئيسية</h1></div>
      <div class="top__end">
        <span class="demo">معاينة: البيانات محفوظة في هذا المتصفح فقط</span>
      </div>
    </header>
    <main id="main">
      <section class="view" id="v-overview" hidden></section>
      <section class="view" id="v-orders" hidden></section>
      <section class="view" id="v-products" hidden></section>
      <section class="view" id="v-product" hidden></section>
      <section class="view" id="v-content" hidden></section>
      <section class="view" id="v-settings" hidden></section>
    </main>
  </div>
</div>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-h" aria-hidden="true">
  <div class="sheet__head"><h2 id="sheet-h"></h2><button class="icon-btn" type="button" aria-label="إغلاق" data-close-sheet><span data-motif="i-close"></span></button></div>
  <div class="sheet__body" id="sheet-body"></div>
  <div class="sheet__foot" id="sheet-foot"></div>
</aside>
<div class="toast-slot" id="toast-slot" role="status" aria-live="polite"></div>

<script src="../assets/js/stitch.js?v=9"></script>
<script src="../assets/js/products.js?v=2"></script>
<script src="admin.js?v=6"></script>

</html>
